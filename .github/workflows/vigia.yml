# Vigía externo del portal (01/11/2026): cada 5 minutos, fuera de la PC. Ver vigia.py.
name: Vigía del portal
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      prueba:
        description: "Probar el aviso (la corrida falla a propósito)"
        type: boolean
        default: false
permissions:
  actions: write     # para re-activar este mismo flujo (abajo)
  contents: read
concurrency:
  group: vigia
  cancel-in-progress: false
jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # el estado de la corrida anterior (caído desde, si ya se avisó): el caché más nuevo que empiece con «estado-»
      - uses: actions/cache/restore@v4
        with:
          path: estado
          key: estado-${{ github.run_id }}
          restore-keys: estado-
      # si el portal está caído (o es una prueba) este paso falla y GitHub avisa al dueño por correo y en su app
      - name: Revisar el portal
        env:
          PRUEBA: ${{ inputs.prueba && '1' || '0' }}
        run: python3 vigia.py
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: estado
          key: estado-${{ github.run_id }}
      # GitHub apaga los flujos programados de un repositorio público tras 60 días sin actividad; re-activarlo reinicia
      # esa cuenta (sin commits). Si falla, no importa para la revisión.
      - name: Que GitHub no lo apague
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/vigia.yml/enable"
